<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146b4b"><title>NutriTrack</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20312b;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#145f46;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}nav{display:flex;gap:6px;overflow:auto;background:white;padding:12px;border-bottom:1px solid #dce6df}button{cursor:pointer;border:1px solid #cbded2;border-radius:10px;background:white;color:#225b44;padding:10px 13px;font-weight:650}button.active,.primary{background:#14734f;color:white;border-color:#14734f}main{max-width:980px;margin:auto;padding:18px}.panel{background:white;border:1px solid #e0e9e3;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 2px 9px #183b2510}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.metric{background:#edf6f0;padding:15px;border-radius:12px}.metric b{display:block;font-size:25px;margin-top:6px}h2{margin:4px 0 14px}h3{margin:16px 0 8px}small,.muted{color:#66776e}label{display:block;margin:8px 0}input,select{padding:9px;border:1px solid #cbd9ce;border-radius:9px;max-width:100%;font:inherit}input[type=number]{width:95px}.bar{height:13px;background:#e3eee7;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#1b9561;transition:width .2s}.food{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #edf1ee}.food .name{flex:1}.food.done{background:#f0faf3}.food .name b{display:block}.food button{min-width:43px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid #e0e8e1;border-radius:9px;padding:8px 2px;text-align:center;min-height:66px;font-size:12px;background:#f8faf8}.day.good{background:#e0f5e6}.day.mid{background:#fff1d5}.day.bad{background:#fbe9e7}.day.selected{outline:2px solid #146b4b}.day .pct{display:block;font-weight:750;margin-top:3px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.note{font-size:13px;color:#5b6e62;line-height:1.5}.danger{color:#a43737}footer{padding:24px;text-align:center;color:#67766b;font-size:12px}@media(max-width:550px){main{padding:10px}.panel{padding:14px}.food{gap:6px}.food input{width:70px}header strong{font-size:20px}}
</style></head><body><header><strong>🌿 NutriTrack</strong><span>Mi nutrición y progreso</span></header><nav id="tabs"></nav><main id="app"></main><footer>NutriTrack · Proyecto personal de Dídac González Sans · Versión de prueba local</footer><script>
const KEY='nutritrack_demo_v1';const foods=[{id:'avena',name:'Avena',unit:'g',k:3.89,p:.169,train:70,rest:55,group:'Desayuno'},{id:'leche',name:'Leche entera',unit:'ml',k:.61,p:.032,train:400,rest:350,group:'Desayuno'},{id:'arroz',name:'Arroz (en seco)',unit:'g',k:3.6,p:.07,train:110,rest:80,group:'Comida'},{id:'pollo',name:'Pollo (crudo)',unit:'g',k:1.1,p:.23,train:180,rest:180,group:'Comida'},{id:'patata',name:'Patata (cruda)',unit:'g',k:.77,p:.02,train:300,rest:250,group:'Cena'},{id:'huevos',name:'Huevos',unit:'unidades',k:72,p:6.3,train:2,rest:2,group:'Cena'},{id:'whey',name:'Proteína whey',unit:'g',k:4,p:.8,train:30,rest:30,group:'Suplementos'},{id:'creatina',name:'Creatina',unit:'g',k:0,p:0,train:5,rest:5,group:'Suplementos'}];
const today=()=>new Date().toLocaleDateString('en-CA');const blank=()=>({days:{},weights:[],measures:[]});let state;try{state=JSON.parse(localStorage.getItem(KEY))||blank()}catch{state=blank()}let tab='Inicio',selected=today();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function day(id=selected){return state.days[id]||(state.days[id]={training:false,foods:{},gym:null,type:'Pesas',minutes:60,intensity:'Moderada',abs:false,legs:false})}function goal(d){return d.training?2950:2650}function totals(d){return foods.reduce((a,f)=>{let q=Number(d.foods[f.id]||0);a.k+=q*f.k;a.p+=q*f.p;return a},{k:0,p:0})}function planTotal(d){return foods.reduce((a,f)=>a+(d.training?f.train:f.rest)*f.k,0)}function compliance(d){let total=foods.reduce((a,f)=>a+(d.training?f.train:f.rest)*f.k,0);let done=foods.reduce((a,f)=>a+Math.min(Number(d.foods[f.id]||0),d.training?f.train:f.rest)*f.k,0);return total?Math.round(100*done/total):0}function el(s){document.getElementById('app').innerHTML=s}function nav(){document.getElementById('tabs').innerHTML=['Inicio','Alimentación','Entrenamiento','Calendario','Progreso'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}function bar(v,max){return `<div class="bar"><div style="width:${Math.max(0,Math.min(100,100*v/max))}%"></div></div>`}function headerDay(){return `<div class="flex"><label>Fecha <input type="date" value="${selected}" onchange="selected=this.value;render()"></label><button class="${day().training?'primary':''}" onclick="day().training=true;save();render()">Día de entrenamiento</button><button class="${!day().training?'primary':''}" onclick="day().training=false;save();render()">Descanso</button></div>`}function summary(){let d=day(),t=totals(d),g=goal(d),p=planTotal(d);return `<div class="grid"><div class="metric">Objetivo energético<b>${g.toLocaleString('es-ES')} kcal</b></div><div class="metric">Calorías registradas<b>${Math.round(t.k)} kcal</b></div><div class="metric">Proteína registrada<b>${Math.round(t.p)} g</b></div><div class="metric">Plan completado<b>${compliance(d)}%</b></div></div><p><b>Calorías pendientes respecto al objetivo: ${Math.max(0,Math.round(g-t.k))} kcal</b></p>${bar(t.k,g)}<p class="note">La lista de alimentos es parcial: su suma prevista es ${Math.round(p)} kcal, no ${g} kcal. Las calorías restantes no representan necesariamente comida que debas añadir: no registramos toda tu alimentación.</p>`}function home(){el(`<section class="panel"><h2>Mi día</h2>${headerDay()}${summary()}</section><section class="panel"><h2>Acceso rápido</h2><div class="flex"><button class="primary" onclick="tab='Alimentación';render()">Registrar alimentos</button><button onclick="tab='Entrenamiento';render()">Registrar entrenamiento</button><button onclick="tab='Progreso';render()">Añadir peso</button></div></section><section class="panel"><h2>Cómo funciona</h2><p>NutriTrack es un proyecto personal de Dídac González Sans. Registra los alimentos principales del plan, tus entrenamientos y tu evolución física. En el futuro se podrá acceder por invitación.</p><p class="note">Las estimaciones no sustituyen asesoramiento médico o dietético individualizado. Los datos de esta versión se guardan únicamente en este navegador.</p></section>`)}function foodChange(id,value){day().foods[id]=Math.max(0,Number(value)||0);save();render()}function eating(){let d=day();let groups=[...new Set(foods.map(f=>f.group))];el(`<section class="panel"><h2>Mi alimentación</h2>${headerDay()}${summary()}</section><section class="panel"><h2>Lista de alimentos</h2><p class="note">Pulsa ✓ para marcar la ración completa, o escribe la cantidad realmente consumida. Puedes desmarcarla. Valores orientativos, no constituyen todavía un menú nutricional completo.</p>${groups.map(group=>`<h3>${group}</h3>${foods.filter(f=>f.group===group).map(f=>{let target=d.training?f.train:f.rest,amount=Number(d.foods[f.id]||0);return `<div class="food ${amount>=target?'done':''}"><button class="${amount>=target?'primary':''}" onclick="foodChange('${f.id}',${amount>=target?0:target})">${amount>=target?'✓':'○'}</button><div class="name"><b>${f.name}</b><small>Objetivo ${target} ${f.unit} · ${Math.round(target*f.k)} kcal</small></div><input aria-label="Cantidad de ${f.name}" type="number" min="0" step="${f.unit==='unidades'?1:5}" value="${amount}" onchange="foodChange('${f.id}',this.value)"><small>${f.unit}</small></div>`}).join('')}`).join('')}</section>`)}function setD(field,value){day()[field]=value;save();render()}function training(){let d=day();el(`<section class="panel"><h2>Registro de entrenamiento</h2>${headerDay()}<label>¿Has entrenado realmente? <select onchange="setD('gym',this.value==='null'?null:this.value==='yes')"><option value="null" ${d.gym===null?'selected':''}>Sin registrar</option><option value="yes" ${d.gym===true?'selected':''}>Sí</option><option value="no" ${d.gym===false?'selected':''}>No</option></select></label><label>Tipo <select onchange="setD('type',this.value)">${['Pesas','Cardio - correr','Cardio - natación','Cardio - bicicleta','Mixto','Otro'].map(x=>`<option ${d.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Duración (minutos) <input type="number" min="0" max="600" value="${d.minutes}" onchange="setD('minutes',Math.max(0,Number(this.value)||0))"></label><label>Intensidad <select onchange="setD('intensity',this.value)">${['Suave','Moderada','Alta'].map(x=>`<option ${d.intensity===x?'selected':''}>${x}</option>`).join('')}</select></label><label><input type="checkbox" ${d.abs?'checked':''} onchange="setD('abs',this.checked)"> Abdominales: 75 repeticiones</label><label><input type="checkbox" ${d.legs?'checked':''} onchange="setD('legs',this.checked)"> He entrenado piernas</label><p class="note">El gasto del ejercicio no se suma automáticamente a las calorías: el objetivo de entrenamiento ya contempla actividad habitual. Más adelante incorporaremos recomendaciones prudentes para sesiones extraordinarias.</p></section>`)}function calendar(){let date=new Date(selected+'T12:00:00'),y=date.getFullYear(),m=date.getMonth(),count=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;let cells=Array.from({length:offset},()=>'<div></div>').join('');for(let i=1;i<=count;i++){let id=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,d=state.days[id],pct=d?compliance(d):null;cells+=`<button class="day ${id===selected?'selected':''} ${pct===null?'':pct>=90?'good':pct>=60?'mid':'bad'}" onclick="selected='${id}';render()">${i}<span class="pct">${pct===null?'—':pct+'%'}</span><span>${d?.gym===true?'🏋️':d?.gym===false?'✕':''}${d?.abs?' · A':''}${d?.legs?' · P':''}</span></button>`}el(`<section class="panel"><h2>Calendario mensual</h2><div class="flex"><button onclick="shiftMonth(-1)">‹</button><b>${date.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)">›</button></div><p class="note">Porcentaje de cumplimiento de los alimentos principales (ponderado por calorías previstas). 🏋️ gimnasio, A abdominales, P piernas. «—» sin registrar.</p><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<div style="text-align:center"><b>${x}</b></div>`).join('')}${cells}</div></section><section class="panel"><h3>Día seleccionado</h3>${headerDay()}<p>Alimentación: <b>${compliance(day())}%</b> · Gimnasio: <b>${day().gym===null?'Sin registrar':day().gym?'Sí':'No'}</b></p><div class="flex"><button onclick="tab='Alimentación';render()">Ver alimentos</button><button onclick="tab='Entrenamiento';render()">Ver entrenamiento</button></div></section>`)}function shiftMonth(delta){let d=new Date(selected+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+delta);selected=d.toLocaleDateString('en-CA');render()}function addWeight(){let n=Number(document.getElementById('weight').value);if(n<=0||n>400)return alert('Introduce un peso válido');state.weights=state.weights.filter(x=>x.date!==selected);state.weights.push({date:selected,value:n});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function addMeasures(){let fields=['fat','muscle','waist'];let r={date:selected};for(let f of fields){let raw=document.getElementById(f).value;if(raw!==''){let v=Number(raw);if(v<0||v>300)return alert('Revisa las medidas');r[f]=v}}state.measures=state.measures.filter(x=>x.date!==selected);state.measures.push(r);save();render()}function progress(){let w=state.weights.slice(-10),ms=state.measures.slice(-5);el(`<section class="panel"><h2>Mi progreso</h2>${headerDay()}<h3>Peso diario</h3><div class="flex"><label>Peso (kg) <input id="weight" type="number" step="0.1" min="1" placeholder="68.0"></label><button class="primary" onclick="addWeight()">Guardar peso</button></div><h3>Últimos registros</h3><p>${w.length?w.map(x=>`${x.date}: <b>${x.value} kg</b>`).join(' · '):'Todavía no hay pesos registrados.'}</p></section><section class="panel"><h2>Medidas semanales (opcionales)</h2><div class="flex"><label>Grasa (%) <input id="fat" type="number" step="0.1" min="0"></label><label>Masa muscular (kg) <input id="muscle" type="number" step="0.1" min="0"></label><label>Cintura (cm) <input id="waist" type="number" step="0.1" min="0"></label></div><button class="primary" onclick="addMeasures()">Guardar medidas</button><p class="note">La bioimpedancia doméstica varía con la hidratación; estas mediciones son complementarias. Los ajustes nutricionales se propondrán usando la tendencia de peso de varias semanas, no fluctuaciones diarias.</p><p>${ms.map(x=>`${x.date}: grasa ${x.fat??'—'}%, músculo ${x.muscle??'—'} kg, cintura ${x.waist??'—'} cm`).join('<br>')||'Sin medidas registradas.'}</p></section>`)}function render(){nav();({Inicio:home,Alimentación:eating,Entrenamiento:training,Calendario:calendar,Progreso:progress}[tab])()}render();
</script></body></html>
