<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146b4b"><title>NutriTrack</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20312b;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#145f46;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}nav{display:flex;gap:6px;overflow:auto;background:white;padding:12px;border-bottom:1px solid #dce6df}button{cursor:pointer;border:1px solid #cbded2;border-radius:10px;background:white;color:#225b44;padding:10px 13px;font-weight:650}button.active,.primary{background:#14734f;color:white;border-color:#14734f}main{max-width:980px;margin:auto;padding:18px}.panel{background:white;border:1px solid #e0e9e3;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 2px 9px #183b2510}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.metric{background:#edf6f0;padding:15px;border-radius:12px}.metric b{display:block;font-size:25px;margin-top:6px}h2{margin:4px 0 14px}h3{margin:16px 0 8px}small,.muted{color:#66776e}label{display:block;margin:8px 0}input,select{padding:9px;border:1px solid #cbd9ce;border-radius:9px;max-width:100%;font:inherit}input[type=number]{width:95px}.bar{height:13px;background:#e3eee7;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#1b9561;transition:width .2s}.food{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #edf1ee}.food .name{flex:1}.food.done{background:#f0faf3}.food .name b{display:block}.food button{min-width:43px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid #e0e8e1;border-radius:9px;padding:8px 2px;text-align:center;min-height:66px;font-size:12px;background:#f8faf8}.day.good{background:#e0f5e6}.day.mid{background:#fff1d5}.day.bad{background:#fbe9e7}.day.selected{outline:2px solid #146b4b}.day .pct{display:block;font-weight:750;margin-top:3px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.note{font-size:13px;color:#5b6e62;line-height:1.5}.danger{color:#a43737}footer{padding:24px;text-align:center;color:#67766b;font-size:12px}@media(max-width:550px){main{padding:10px}.panel{padding:14px}.food{gap:6px}.food input{width:70px}header strong{font-size:20px}}
</style></head><body><header><strong>🌿 NutriTrack</strong><span>Mi nutrición y progreso</span></header><nav id="tabs"></nav><main id="app"></main><footer>NutriTrack · Proyecto personal de Dídac González Sans · Versión de prueba · datos guardados en este navegador</footer><script>
const KEY='nutritrack_demo_v3';const PREVKEY='nutritrack_demo_v2';const OLDKEY='nutritrack_demo_v1';
const foods=[
{id:'avena',name:'Avena (seca)',unit:'g',k:3.89,p:.169,train:80,rest:65,group:'Desayuno'},
{id:'leche',name:'Leche entera',unit:'ml',k:.61,p:.032,train:300,rest:300,group:'Desayuno'},
{id:'platano',name:'Plátano',unit:'g',k:.89,p:.011,train:120,rest:120,group:'Desayuno'},
{id:'pan',name:'Pan integral',unit:'g',k:2.47,p:.09,train:90,rest:70,group:'Media mañana'},
{id:'pavo',name:'Pavo (fiambre bajo en sal)',unit:'g',k:1.05,p:.20,train:80,rest:80,group:'Media mañana'},
{id:'arroz',name:'Arroz (peso en seco)',unit:'g',k:3.6,p:.07,train:115,rest:85,group:'Comida'},
{id:'pollo',name:'Pollo (peso en crudo)',unit:'g',k:1.1,p:.23,train:150,rest:150,group:'Comida'},
{id:'aceite1',name:'Aceite de oliva (comida)',unit:'ml',k:8.1,p:0,train:12,rest:12,group:'Comida'},
{id:'yogur',name:'Yogur natural',unit:'g',k:.63,p:.04,train:250,rest:250,group:'Merienda'},
{id:'nueces',name:'Nueces',unit:'g',k:6.54,p:.152,train:25,rest:20,group:'Merienda'},
{id:'whey',name:'Proteína whey (polvo)',unit:'g',k:4,p:.8,train:30,rest:30,group:'Merienda'},
{id:'patata',name:'Patata (peso en crudo)',unit:'g',k:.77,p:.02,train:400,rest:350,group:'Cena'},
{id:'huevos',name:'Huevos',unit:'unidades',k:72,p:6.3,train:2,rest:2,group:'Cena'},
{id:'salmon',name:'Salmón (peso en crudo)',unit:'g',k:2.08,p:.20,train:120,rest:120,group:'Cena'},
{id:'aceite2',name:'Aceite de oliva (cena)',unit:'ml',k:8.1,p:0,train:10,rest:10,group:'Cena'},
{id:'creatina',name:'Creatina',unit:'g',k:0,p:0,train:5,rest:5,group:'Suplementos'}];
const profileDefaults={age:40,sex:'M',height:178,initialWeight:68,goalWeight:70,activity:1.55,adjustment:0,health:[],avoidFoods:'',preferences:''};
const today=()=>new Date().toLocaleDateString('en-CA');const blank=()=>({days:{},weights:[],measures:[],profile:{...profileDefaults}});let state;try{state=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(PREVKEY))||JSON.parse(localStorage.getItem(OLDKEY))||blank()}catch{state=blank()}state.profile={...profileDefaults,...state.profile};let tab='Inicio',selected=today();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function day(id=selected){return state.days[id]||(state.days[id]={training:false,foods:{},gym:null,swaps:{},type:'Pesas',minutes:60,intensity:'Moderada',abs:false,legs:false})}function latestWeight(){const ws=state.weights.filter(x=>x.date<=selected).sort((a,b)=>a.date.localeCompare(b.date));return ws.length?ws.at(-1).value:state.profile.initialWeight}
function averageWeight(endDate,days=7){let end=new Date(endDate+'T12:00:00');let start=new Date(end);start.setDate(start.getDate()-(days-1));let arr=state.weights.filter(x=>{let dt=new Date(x.date+'T12:00:00');return dt>=start&&dt<=end}).map(x=>x.value);return arr.length>=3?arr.reduce((a,b)=>a+b,0)/arr.length:null}
function energy(){let p=state.profile,w=latestWeight(),bmr=10*w+6.25*p.height-5*p.age+(p.sex==='M'?5:-161);return {w,bmr,tdee:bmr*p.activity}}
function goal(d){let e=energy();return Math.round((e.tdee+225+(d.training?150:-150)+state.profile.adjustment)/25)*25}
function portion(f,d){return (d.training?f.train:f.rest)*goal(d)/(d.training?2950:2650)}
function proposal(){let end=new Date(selected+'T12:00:00'),prior=new Date(end);prior.setDate(prior.getDate()-14);let current=averageWeight(selected,7),previous=averageWeight(prior.toLocaleDateString('en-CA'),7);if(current===null||previous===null)return null;let delta=current-previous;return {current,previous,delta,weekly:delta/2,change:delta<.2?100:delta>.6?-100:0}}
const alternatives={
 arroz:[['Pasta (seca)',3.55,.125,'g'],['Quinoa (seca)',3.68,.14,'g'],['Patata (cruda)',.77,.02,'g']],
 pollo:[['Pavo fresco (crudo)',1.1,.24,'g'],['Ternera magra (cruda)',1.4,.21,'g'],['Tofu firme',1.35,.14,'g']],
 salmon:[['Merluza (cruda)',.82,.18,'g'],['Atún fresco (crudo)',1.3,.24,'g'],['Sardinas (crudas)',1.85,.20,'g']],
 patata:[['Arroz (seco)',3.6,.07,'g'],['Pasta (seca)',3.55,.125,'g'],['Boniato (crudo)',.86,.016,'g']],
 avena:[['Pan integral',2.47,.09,'g'],['Copos de maíz sin azúcar',3.6,.07,'g']],
 leche:[['Leche semidesnatada',.46,.033,'ml'],['Bebida de soja sin azúcar',.33,.032,'ml']],
 nueces:[['Almendras',5.79,.21,'g'],['Avellanas',6.28,.15,'g']],
 yogur:[['Yogur griego natural',1.2,.05,'g'],['Skyr natural',.63,.11,'g']],
 pan:[['Avena (seca)',3.89,.169,'g'],['Tortitas de arroz',3.85,.08,'g']],
 pavo:[['Pechuga de pollo cocinada',1.65,.31,'g'],['Queso fresco batido 0%',.46,.08,'g']]
};
const healthOptions=[['celiac','Celiaquía / evitar gluten'],['lactose','Intolerancia a la lactosa'],['milk','Alergia a la proteína de leche'],['nuts','Alergia a frutos secos'],['fish','Alergia al pescado'],['egg','Alergia al huevo'],['gallstones','Colelitiasis / problemas biliares'],['renal','Enfermedad renal'],['diabetes','Diabetes'],['cholesterol','Colesterol elevado'],['other','Otra condición de salud']];
function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function blocked(name){let n=name.toLocaleLowerCase('es'),h=state.profile.health||[];if(h.includes('celiac')&&/pan |pasta|avena|copos de maíz|tortitas de arroz/.test(n))return 'Revisar gluten y certificación sin gluten';if(h.includes('lactose')&&/leche|yogur|skyr|queso|whey/.test(n))return 'Contiene o puede contener lactosa';if(h.includes('milk')&&/leche|yogur|skyr|queso|whey/.test(n))return 'Puede contener proteína de leche';if(h.includes('nuts')&&/nueces|almendras|avellanas/.test(n))return 'Frutos secos';if(h.includes('fish')&&/salmón|merluza|atún|sardinas/.test(n))return 'Pescado';if(h.includes('egg')&&/huevos/.test(n))return 'Huevo';let avoid=(state.profile.avoidFoods||'').split(',').map(x=>x.trim().toLocaleLowerCase('es')).filter(Boolean);if(avoid.some(x=>n.includes(x)))return 'Alimento excluido por preferencia';return ''}
function setHealth(code,on){let h=new Set(state.profile.health||[]);on?h.add(code):h.delete(code);state.profile.health=[...h];save();render()}
function setPreference(field,value){state.profile[field]=value;save()}
function effective(f,d){let idx=d.swaps?.[f.id];if(idx!==undefined&&alternatives[f.id]?.[idx]){let a=alternatives[f.id][idx];return {...f,name:a[0],k:a[1],p:a[2],unit:a[3],base:f,substituted:true}}if(blocked(f.name)){let a=alternatives[f.id]?.find(a=>!blocked(a[0]));if(a)return {...f,name:a[0],k:a[1],p:a[2],unit:a[3],base:f,substituted:true,auto:true}}return {...f,base:f}}
function target(f,d){let base=portion(f,d);let eff=effective(f,d);return eff.substituted?Math.round(base*f.k/eff.k/5)*5:f.unit==='unidades'?Math.round(base):Math.round(base/5)*5}
function totals(d){return foods.reduce((a,f)=>{let eff=effective(f,d),q=Number(d.foods[f.id]||0);a.k+=q*eff.k;a.p+=q*eff.p;return a},{k:0,p:0})}
function planTotal(d){return foods.reduce((a,f)=>a+target(f,d)*effective(f,d).k,0)}
function compliance(d){let total=planTotal(d);let done=foods.reduce((a,f)=>a+Math.min(Number(d.foods[f.id]||0),target(f,d))*effective(f,d).k,0);return total?Math.round(100*done/total):0}
function el(s){document.getElementById('app').innerHTML=s}
function nav(){document.getElementById('tabs').innerHTML=['Inicio','Alimentación','Entrenamiento','Calendario','Progreso','Mi perfil'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}
function bar(v,max){return `<div class="bar"><div style="width:${Math.max(0,Math.min(100,100*v/max))}%"></div></div>`}
function headerDay(){return `<div class="flex"><label>Fecha <input type="date" value="${selected}" onchange="selected=this.value;render()"></label><button class="${day().training?'primary':''}" onclick="day().training=true;save();render()">Día de entrenamiento</button><button class="${!day().training?'primary':''}" onclick="day().training=false;save();render()">Descanso</button></div>`}
function summary(){let d=day(),t=totals(d),g=goal(d),p=planTotal(d);return `<div class="grid"><div class="metric">Objetivo energético<b>${g.toLocaleString('es-ES')} kcal</b></div><div class="metric">Calorías registradas<b>${Math.round(t.k)} kcal</b></div><div class="metric">Proteína registrada<b>${Math.round(t.p)} g</b></div><div class="metric">Plan completado<b>${compliance(d)}%</b></div></div><p><b>Calorías pendientes respecto al objetivo: ${Math.max(0,Math.round(g-t.k))} kcal</b></p>${bar(t.k,g)}<p class="note">Menú planificado: ${Math.round(p)} kcal. Objetivo calculado: ${g} kcal. Diferencia: ${Math.round(p-g)>0?'+':''}${Math.round(p-g)} kcal; comprueba este valor antes de usar el menú como pauta. Son estimaciones; los alimentos no registrados también aportan energía. La barra no equivale necesariamente a la ingesta real total.</p>`}
function home(){el(`<section class="panel"><h2>Mi día</h2>${headerDay()}${summary()}<p class="note">Peso de referencia: ${energy().w.toFixed(1)} kg · Gasto diario estimado: ${Math.round(energy().tdee)} kcal · <a href="#" onclick="event.preventDefault();tab='Mi perfil';render()">Editar perfil</a></p></section><section class="panel"><h2>Acceso rápido</h2><div class="flex"><button class="primary" onclick="tab='Alimentación';render()">Registrar alimentos</button><button onclick="tab='Entrenamiento';render()">Registrar entrenamiento</button><button onclick="tab='Progreso';render()">Añadir peso</button></div></section><section class="panel"><h2>Cómo funciona</h2><p>NutriTrack es un proyecto personal de Dídac González Sans. Registra alimentos principales, entrenamientos y evolución física. En el futuro se podrá acceder por invitación.</p><p class="note">Versión de prueba. Los datos se guardan solo en este navegador. No introduzcas datos de salud sensibles hasta habilitar cuentas privadas.</p></section>`)}
function foodChange(id,value){let f=foods.find(x=>x.id===id);if(f&&blocked(effective(f,day()).name))return alert('Este alimento está restringido en tu perfil. Revisa una alternativa antes de registrarlo.');day().foods[id]=Math.max(0,Number(value)||0);save();render()}
function changeSwap(id,value){let d=day();if(value!=='original'){let a=alternatives[id]?.[Number(value)];if(!a||blocked(a[0]))return alert('Esta alternativa está restringida en tu perfil.')}else if(blocked(foods.find(f=>f.id===id)?.name||''))return alert('El alimento original está restringido en tu perfil.');d.swaps ||= {};if(value==='original')delete d.swaps[id];else d.swaps[id]=Number(value);d.foods[id]=0;save();render()}
function eating(){let d=day();let groups=[...new Set(foods.map(f=>f.group))];el(`<section class="panel"><h2>Mi alimentación</h2>${headerDay()}${summary()}</section><section class="panel"><h2>Alimentos y sustituciones</h2><p class="note">Si un alimento original está restringido, se propone automáticamente una alternativa disponible; comprueba siempre los ingredientes y las etiquetas. Los alimentos sin alternativa segura se mantienen señalados y requieren revisión. Puedes cambiar algunos alimentos por alternativas de energía aproximada. Al sustituir un alimento, su cantidad registrada se pone a cero. Las cantidades de arroz, pasta y quinoa se expresan en seco; carnes y pescados, en crudo. Las equivalencias calóricas no garantizan igual proteína, fibra o micronutrientes.</p>${groups.map(group=>`<h3>${group}</h3>${foods.filter(f=>f.group===group).map(f=>{let eff=effective(f,d),amount=Number(d.foods[f.id]||0),wanted=target(f,d),sw=d.swaps?.[f.id],warning=blocked(eff.name);return `<div class="food ${amount>=wanted?'done':''}"><button class="${amount>=wanted?'primary':''}" onclick="foodChange('${f.id}',${amount>=wanted?0:wanted})">${amount>=wanted?'✓':'○'}</button><div class="name"><b>${eff.name}</b>${eff.auto?'<small style="color:#146b4b">Alternativa sugerida automáticamente según tu perfil</small>':''}${warning?`<small class="danger">⚠ ${safeText(warning)}. No consumir sin revisar.</small>`:''}<small>Objetivo ${wanted} ${eff.unit} · ${Math.round(wanted*eff.k)} kcal · ${Math.round(wanted*eff.p)} g proteína</small>${alternatives[f.id]?`<label style="display:block;margin-top:6px;font-size:12px">Sustituir por <select style="max-width:230px" onchange="changeSwap('${f.id}',this.value)"><option value="original" ${sw===undefined?'selected':''}>${blocked(f.name)?'Automática: ': 'Original: '}${blocked(f.name)?eff.name:f.name}</option>${alternatives[f.id].filter(a=>!blocked(a[0])).map(a=>{let i=alternatives[f.id].indexOf(a);return `<option value="${i}" ${sw===i?'selected':''}>${a[0]}</option>`}).join('')}</select></label>`:''}</div><input aria-label="Cantidad de ${eff.name}" type="number" min="0" step="${eff.unit==='unidades'?1:5}" value="${amount}" onchange="foodChange('${f.id}',this.value)"><small>${eff.unit}</small></div>`}).join('')}`).join('')}</section>`)}
function setD(field,value){day()[field]=value;save();render()}function training(){let d=day();el(`<section class="panel"><h2>Registro de entrenamiento</h2>${headerDay()}<label>¿Has entrenado realmente? <select onchange="setD('gym',this.value==='null'?null:this.value==='yes')"><option value="null" ${d.gym===null?'selected':''}>Sin registrar</option><option value="yes" ${d.gym===true?'selected':''}>Sí</option><option value="no" ${d.gym===false?'selected':''}>No</option></select></label><label>Tipo <select onchange="setD('type',this.value)">${['Pesas','Cardio - correr','Cardio - natación','Cardio - bicicleta','Mixto','Otro'].map(x=>`<option ${d.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Duración (minutos) <input type="number" min="0" max="600" value="${d.minutes}" onchange="setD('minutes',Math.max(0,Number(this.value)||0))"></label><label>Intensidad <select onchange="setD('intensity',this.value)">${['Suave','Moderada','Alta'].map(x=>`<option ${d.intensity===x?'selected':''}>${x}</option>`).join('')}</select></label><label><input type="checkbox" ${d.abs?'checked':''} onchange="setD('abs',this.checked)"> Abdominales: 75 repeticiones</label><label><input type="checkbox" ${d.legs?'checked':''} onchange="setD('legs',this.checked)"> He entrenado piernas</label><p class="note">El gasto del ejercicio no se suma automáticamente a las calorías: el objetivo de entrenamiento ya contempla actividad habitual. Más adelante incorporaremos recomendaciones prudentes para sesiones extraordinarias.</p></section>`)}function calendar(){let date=new Date(selected+'T12:00:00'),y=date.getFullYear(),m=date.getMonth(),count=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;let cells=Array.from({length:offset},()=>'<div></div>').join('');for(let i=1;i<=count;i++){let id=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,d=state.days[id],pct=d?compliance(d):null;cells+=`<button class="day ${id===selected?'selected':''} ${pct===null?'':pct>=90?'good':pct>=60?'mid':'bad'}" onclick="selected='${id}';render()">${i}<span class="pct">${pct===null?'—':pct+'%'}</span><span>${d?.gym===true?'🏋️':d?.gym===false?'✕':''}${d?.abs?' · A':''}${d?.legs?' · P':''}</span></button>`}el(`<section class="panel"><h2>Calendario mensual</h2><div class="flex"><button onclick="shiftMonth(-1)">‹</button><b>${date.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)">›</button></div><p class="note">Porcentaje de cumplimiento de los alimentos principales (ponderado por calorías previstas). 🏋️ gimnasio, A abdominales, P piernas. «—» sin registrar.</p><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<div style="text-align:center"><b>${x}</b></div>`).join('')}${cells}</div></section><section class="panel"><h3>Día seleccionado</h3>${headerDay()}<p>Alimentación: <b>${compliance(day())}%</b> · Gimnasio: <b>${day().gym===null?'Sin registrar':day().gym?'Sí':'No'}</b></p><div class="flex"><button onclick="tab='Alimentación';render()">Ver alimentos</button><button onclick="tab='Entrenamiento';render()">Ver entrenamiento</button></div></section>`)}function shiftMonth(delta){let d=new Date(selected+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+delta);selected=d.toLocaleDateString('en-CA');render()}function addWeight(){let n=Number(document.getElementById('weight').value);if(n<=0||n>400)return alert('Introduce un peso válido');state.weights=state.weights.filter(x=>x.date!==selected);state.weights.push({date:selected,value:n});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function addMeasures(){let fields=['fat','muscle','waist'];let r={date:selected};for(let f of fields){let raw=document.getElementById(f).value;if(raw!==''){let v=Number(raw);if(v<0||v>300)return alert('Revisa las medidas');r[f]=v}}state.measures=state.measures.filter(x=>x.date!==selected);state.measures.push(r);save();render()}function weightChart(){
 const points=state.weights.filter(x=>Number.isFinite(Number(x.value))&&Number(x.value)>0).slice().sort((a,b)=>a.date.localeCompare(b.date));
 if(points.length<2)return '<p class="note">Introduce al menos dos pesos en fechas diferentes para mostrar el gráfico de evolución.</p>';
 const W=760,H=320,L=56,R=22,T=24,B=48,values=points.map(x=>Number(x.value));
 const goalWeight=Number(state.profile.goalWeight),all=values.concat(Number.isFinite(goalWeight)?[goalWeight]:[]);
 let min=Math.floor((Math.min(...all)-.5)*2)/2,max=Math.ceil((Math.max(...all)+.5)*2)/2;if(max-min<2){min-=1;max+=1}
 const x=i=>L+i*(W-L-R)/Math.max(1,points.length-1),y=v=>T+(max-v)*(H-T-B)/(max-min);
 const poly=arr=>arr.map(q=>`${x(q.i).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ');
 const average=points.map((p,i)=>{let end=new Date(p.date+'T12:00:00'),start=new Date(end);start.setDate(start.getDate()-6);let vals=points.slice(0,i+1).filter(q=>new Date(q.date+'T12:00:00')>=start).map(q=>Number(q.value));return {i,v:vals.reduce((a,b)=>a+b,0)/vals.length}});
 let lines='';for(let i=0;i<=4;i++){let v=min+(max-min)*i/4;lines+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#e1ebe5"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#61776b">${v.toFixed(1)}</text>`}
 const labels=[0,Math.floor((points.length-1)/2),points.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-16}" font-size="12" text-anchor="middle" fill="#61776b">${points[i].date.slice(5)}</text>`).join('');
 const goalLine=Number.isFinite(goalWeight)?`<line x1="${L}" y1="${y(goalWeight)}" x2="${W-R}" y2="${y(goalWeight)}" stroke="#d28c30" stroke-width="2" stroke-dasharray="7 5"/>`:'';
 const circles=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(Number(p.value))}" r="3.5" fill="#89b5a0"><title>${safeText(p.date)}: ${Number(p.value).toFixed(1)} kg</title></circle>`).join('');
 const last=values.at(-1),first=values[0],delta=last-first;
 return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolución del peso con valores diarios, media móvil de siete días y línea del objetivo" style="width:100%;height:auto;display:block">${lines}${goalLine}<polyline points="${poly(points.map((p,i)=>({i,v:Number(p.value)})))}" fill="none" stroke="#91b7a5" stroke-width="2"/>${circles}<polyline points="${poly(average)}" fill="none" stroke="#136c4a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${labels}</svg></div><div class="flex" style="font-size:13px;gap:16px"><span>🟢 Media móvil de 7 días</span><span>● Peso registrado</span><span style="color:#a86b1d">┄ Objetivo (${goalWeight.toFixed(1)} kg)</span></div><p><b>Cambio entre el primer y último registro: ${delta>=0?'+':''}${delta.toFixed(2)} kg.</b> ${points.length>=7?'Valora sobre todo la media móvil, no los cambios diarios.':'Con más registros podrás interpretar mejor la tendencia.'}</p>`;
}
function progress(){let w=state.weights.slice(-10),ms=state.measures.slice(-5);el(`<section class="panel"><h2>Mi progreso</h2>${headerDay()}<h3>Peso diario</h3><div class="flex"><label>Peso (kg) <input id="weight" type="number" step="0.1" min="1" placeholder="68.0"></label><button class="primary" onclick="addWeight()">Guardar peso</button></div><p class="note">Peso de referencia actual: <b>${latestWeight().toFixed(1)} kg</b>. Las raciones se recalculan según este peso y el gasto estimado; los cambios deliberados del superávit se basan en varias semanas de evolución.</p><h3>Evolución del peso</h3>${weightChart()}<h3>Últimos registros</h3><p>${w.length?w.map(x=>`${x.date}: <b>${x.value} kg</b>`).join(' · '):'Todavía no hay pesos registrados.'}</p></section><section class="panel"><h2>Medidas semanales (opcionales)</h2><div class="flex"><label>Grasa (%) <input id="fat" type="number" step="0.1" min="0"></label><label>Masa muscular (kg) <input id="muscle" type="number" step="0.1" min="0"></label><label>Cintura (cm) <input id="waist" type="number" step="0.1" min="0"></label></div><button class="primary" onclick="addMeasures()">Guardar medidas</button><p class="note">La bioimpedancia doméstica varía con la hidratación; estas mediciones son complementarias. Los ajustes nutricionales se propondrán usando la tendencia de peso de varias semanas, no fluctuaciones diarias.</p><p>${ms.map(x=>`${x.date}: grasa ${x.fat??'—'}%, músculo ${x.muscle??'—'} kg, cintura ${x.waist??'—'} cm`).join('<br>')||'Sin medidas registradas.'}</p></section>`)}function updateProfile(field,value){state.profile[field]=field==='sex'?value:Number(value);save();render()}
function applyAdjustment(change){state.profile.adjustment=Math.max(-400,Math.min(400,state.profile.adjustment+change));save();render()}
function profile(){let p=state.profile,e=energy(),r=proposal();el(`<section class="panel"><h2>Mi perfil y cálculo energético</h2><p class="note">Datos editables. Fórmula de Mifflin-St Jeor y factor de actividad orientativo. No sustituye una evaluación individual.</p><div class="grid"><label>Edad (años)<br><input type="number" min="16" max="100" value="${p.age}" onchange="updateProfile('age',this.value)"></label><label>Sexo para la fórmula<br><select onchange="updateProfile('sex',this.value)"><option value="M" ${p.sex==='M'?'selected':''}>Masculino</option><option value="F" ${p.sex==='F'?'selected':''}>Femenino</option></select></label><label>Altura (cm)<br><input type="number" min="100" max="230" value="${p.height}" onchange="updateProfile('height',this.value)"></label><label>Peso inicial (kg)<br><input type="number" min="30" max="300" step="0.1" value="${p.initialWeight}" onchange="updateProfile('initialWeight',this.value)"></label><label>Objetivo de peso (kg)<br><input type="number" min="30" max="300" step="0.1" value="${p.goalWeight}" onchange="updateProfile('goalWeight',this.value)"></label><label>Actividad habitual<br><select onchange="updateProfile('activity',this.value)">${[['1.2','Sedentaria'],['1.375','Ligera'],['1.55','Moderada'],['1.725','Alta']].map(([v,t])=>`<option value="${v}" ${Math.abs(p.activity-Number(v))<.001?'selected':''}>${t} (${v})</option>`).join('')}</select></label></div><div class="grid"><div class="metric">Peso de referencia<b>${e.w.toFixed(1)} kg</b></div><div class="metric">Metabolismo basal<b>${Math.round(e.bmr)} kcal</b></div><div class="metric">Gasto diario estimado<b>${Math.round(e.tdee)} kcal</b></div><div class="metric">Ajuste por tendencia<b>${p.adjustment>0?'+':''}${p.adjustment} kcal</b></div></div><p class="note">Objetivo de entrenamiento: ${goal({training:true})} kcal; descanso: ${goal({training:false})} kcal. El factor de actividad ya representa la actividad habitual; la diferencia por día es una distribución orientativa, no calorías del gimnasio añadidas dos veces.</p></section><section class="panel"><h2>Revisión de la tendencia</h2>${r?`<p>Media reciente: <b>${r.current.toFixed(2)} kg</b>. Media de hace dos semanas: <b>${r.previous.toFixed(2)} kg</b>. Cambio aproximado: <b>${r.weekly>=0?'+':''}${r.weekly.toFixed(2)} kg/semana</b>.</p>${r.change?`<p>Se propone ${r.change>0?'aumentar':'reducir'} ${Math.abs(r.change)} kcal/día para aproximarse a una ganancia gradual de masa muscular.</p><button class="primary" onclick="applyAdjustment(${r.change})">Aceptar ajuste de ${r.change>0?'+':''}${r.change} kcal</button>`:'<p class="note">El ritmo de aumento es compatible con el objetivo orientativo; no se propone ningún cambio.</p>'}`:'<p class="note">Para proponer ajustes por evolución se necesitan al menos tres registros en la última semana y tres en una semana comparable de hace dos semanas. No se realizan cambios automáticos de superávit.</p>'}<p class="note">Al modificar el peso, el gasto y las raciones se recalculan. Las propuestas de +/−100 kcal requieren confirmación. Si tienes condiciones de salud o restricciones alimentarias, este menú genérico deberá personalizarse antes de utilizarlo como pauta.</p></section><section class="panel"><h2>Salud, restricciones y preferencias</h2><p class="note">Selecciona las condiciones que afectan a tus elecciones alimentarias. Las restricciones se comprueban por nombre de alimento, se proponen alternativas cuando existen y se bloquea el registro de alimentos detectados como incompatibles. Es un filtro orientativo: no verifica ingredientes, contaminación cruzada ni etiquetas. Las enfermedades requieren valoración individual: la app no prescribe una dieta clínica.</p><div class="grid">${healthOptions.map(([code,label])=>`<label><input type="checkbox" ${((p.health||[]).includes(code))?'checked':''} onchange="setHealth('${code}',this.checked)"> ${label}</label>`).join('')}</div><label>Alimentos que no deseas consumir (separados por comas)<br><input style="width:100%" value="${safeText(p.avoidFoods)}" placeholder="Ej.: boniato, cerdo" onchange="setPreference('avoidFoods',this.value);render()"></label><label>Preferencias o peticiones especiales<br><textarea style="width:100%;min-height:85px;padding:10px;border:1px solid #cbd9ce;border-radius:9px;font:inherit" placeholder="Ej.: prefiero patata, cuatro comidas al día" onchange="setPreference('preferences',this.value)">${safeText(p.preferences)}</textarea></label>${(p.health||[]).some(x=>['gallstones','renal','diabetes','cholesterol','other'].includes(x))?'<p class="danger">Hay condiciones clínicas registradas. El plan genérico NO está adaptado clínicamente: revisa alimentos y cantidades con un profesional antes de usarlo como pauta.</p>':''}<p class="note">Esta versión de prueba guarda estos datos solo en este navegador. Evita introducir detalles médicos sensibles hasta habilitar cuentas privadas y Supabase.</p></section>`)}
function render(){nav();({Inicio:home,Alimentación:eating,Entrenamiento:training,Calendario:calendar,Progreso:progress,'Mi perfil':profile}[tab])()}render();
</script></body></html>
