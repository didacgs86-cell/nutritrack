function fatCarb(f,eff){if(eff.variantNutrition)return eff.variantNutrition;if(eff.substituted){const match=macroByName.find(x=>x[0].test(eff.name));if(match)return match[1];}return macroDatabase[f.weeklyKey||f.id]||[null,null]}
function macroTargets(d){let w=energy().w,k=goal(d),p=Math.round(w*1.8),f=Math.round(w*1),c=Math.max(0,Math.round((k-p*4-f*9)/4));return {k,p,f,c}}

function eatenMacros(d){let k=0,p=0,fat=0,carbs=0;activeFoods(d).forEach(item=>{let eff=effective(item,d),q=Number(d.foods[item.id]||0),fc=fatCarb(item,eff);k+=q*eff.k;p+=q*eff.p;if(fc[0]!==null){fat+=q*fc[0];carbs+=q*fc[1]}});return {k,p,fat,carbs}}

function totals(d){return activeFoods(d).reduce((a,f)=>{let eff=effective(f,d),q=Number(d.foods[f.id]||0);a.k+=q*eff.k;a.p+=q*eff.p;return a},{k:0,p:0})}

 // Se respetan los alimentos restringidos: no se incluyen sustituciones no verificadas.

function mealAdditionPlan(key,group){
 const d=day(),c=weeklyCatalog.find(x=>x[0]===key);if(!c)return {amount:0,changes:[],message:'Alimento no disponible'};
 const idx=Number(document.getElementById('newVariant')?.value||0);const k=Number((foodVariants[key]||[])[idx]?.[1]??c[2]);

 const mealBudget=existingK>0?existingK:goal(d)*(shares[group]||.15);
 const defaults={pavo:65,jamonserrano:40,queso:60,leche:250,pan:70,pollo:150,pavofresco:150,ternera:150,salmon:150,merluza:180,atun:150,panga:180,arroz:85,pasta:90,patata:300,quinoa:80,legumbre:220,nueces:25,almendras:25,aguacate:80,platano:120,manzana:150,uvas:140,ciruelas:140,melocoton:150,yogur:200,avena:65,huevos:2,aceite:10,whey:30,creatina:5};

 const maxEnergy=Math.max(0,mealBudget*.4);
 const desiredK=Math.min(base*k*Math.max(.75,Math.min(1.3,goal(d)/2600)),maxEnergy);
 const amount=key==='huevos'?Math.max(1,Math.round(desiredK/Math.max(k,.001))):Math.max(5,Math.round(desiredK/Math.max(k,.001)/5)*5);
 const newEnergy=amount*k;
 const excess=Math.max(0,existingK+newEnergy-mealBudget);
 const factor=existingK>0?Math.max(0,(existingK-excess)/existingK):1;
 const changes=current.map(f=>{const old=Number(amounts[f.id]||0),next=f.unit==='unidades'?Math.round(old*factor):Math.round(old*factor/5)*5;return {id:f.id,name:effective(f,d).name,old,next}}).filter(x=>x.next!==x.old);
 return {amount,changes,existingK,mealBudget,newEnergy,message:changes.length?'Se ajustarán las cantidades previstas de '+changes.length+' alimento(s) de '+group+' para mantener aproximadamente las calorías de esa comida.':'No es necesario reducir otros alimentos de esta comida.'};
}

function modeTabs(){return `<section class="panel"><div class="flex"><button class="${(day().foodMode||'personalizado')==='personalizado'?'primary':''}" onclick="day().foodMode='personalizado';save();render()">Menú personalizado</button><button class="${day().foodMode==='relajado'?'primary':''}" onclick="day().foodMode='relajado';save();render()">Modo relajado · Registro rápido</button></div><p class="note">Los dos modos guardan registros separados. Cambiar de modo no borra lo anterior. El resumen de Inicio muestra el modo elegido para el día.</p></section>`}

function eating(){if(day().foodMode==='relajado'){relaxedMode();document.getElementById('app').insertAdjacentHTML('afterbegin',modeTabs());return;}let d=day();let groups=[...new Set(activeFoods(d).map(f=>f.group))];el(`${modeTabs()}<section class="panel"><h2>Mi alimentación</h2>${headerDay()}${summary()}</section>${mealOverview(d)}${weeklyPanel()}<div id="replacementPanel"></div><section class="panel"><h2>Alimentos, variedades y sustituciones</h2><p class="note">Si un alimento original está restringido, se propone automáticamente una alternativa disponible; comprueba siempre los ingredientes y las etiquetas. Los alimentos sin alternativa segura se mantienen señalados y requieren revisión. Puedes cambiar algunos alimentos por alternativas de energía aproximada. Al sustituir un alimento, su cantidad registrada se pone a cero. Los objetivos de macronutrientes son orientativos. Las raciones de avena, arroz, patata, pan y aceite se ajustan para aproximar el menú al objetivo calórico. Las proteínas principales y suplementos mantienen cantidades de referencia. Las cantidades de arroz, pasta y quinoa se expresan en seco; carnes y pescados, en crudo. Las equivalencias calóricas no garantizan igual proteína, fibra o micronutrientes.</p>${groups.map(group=>`<h3>${group}</h3>${activeFoods(d).filter(f=>f.group===group).map(f=>{let eff=effective(f,d),amount=Number(d.foods[f.id]||0),wanted=target(f,d),sw=d.swaps?.[f.id],warning=blocked(eff.name);return `<div class="food ${amount>=wanted?'done':''}"><button class="${amount>=wanted?'primary':''}" onclick="foodChange('${f.id}',${amount>=wanted?0:wanted})">${amount>=wanted?'✓':'○'}</button><div class="name"><b>${eff.name}</b>${eff.auto?'<small style="color:#146b4b">Alternativa sugerida automáticamente según tu perfil</small>':''}${warning?`<small class="danger">⚠ ${safeText(warning)}. No consumir sin revisar.</small>`:''}<small>Objetivo ${wanted} ${eff.unit} · ${Math.round(wanted*eff.k)} kcal · ${Math.round(wanted*eff.p)} g proteína</small>${d.menuItems!==undefined?`<label style="display:block;font-size:12px">Cantidad prevista <input type="number" min="0" step="${eff.unit==='unidades'?1:5}" value="${wanted}" onchange="changePlanned('${f.id}',this.value)"> ${eff.unit} <button onclick="removeMenuFood('${f.id}')">Quitar</button><button onclick="openReplaceFood('${f.id}')">Sustituir</button></label>`:''}${variantsFor(f).length>1?`<label style="display:block;margin-top:6px;font-size:12px">Elegir variedad / sustituir <select style="max-width:260px" onchange="suggestVariant('${f.id}',this.value)"><option value="" ${d.variants?.[f.id]===undefined?'selected':''}>Original: ${safeText(f.name)}</option>${variantsFor(f).map((a,i)=>`<option value="${i}" ${d.variants?.[f.id]===i?'selected':''} ${blocked(a[0])?'disabled':''}>${safeText(a[0])}</option>`).join('')}</select></label>`:''}${d.menuItems===undefined?`<button onclick="removeBaseFood('${f.id}')" style="font-size:12px;margin-top:5px">Quitar de este día</button><button onclick="openReplaceFood('${f.id}')" style="font-size:12px;margin-top:5px">Sustituir</button>`:''}</div><input aria-label="Cantidad de ${eff.name}" type="number" min="0" step="${eff.unit==='unidades'?1:5}" value="${amount}" onchange="foodChange('${f.id}',this.value)"><small>${eff.unit}</small></div>`}).join('')}`).join('')}</section>`)}
function mealOverview(d){const groups=[...new Set(activeFoods(d).map(f=>f.group))];return `<section class="panel"><h2>Seguimiento por comidas</h2><p class="note">Para comidas, el porcentaje se calcula sobre las calorías previstas. Los suplementos se contabilizan por cantidad registrada, incluso cuando no aportan calorías.</p><div class="grid">${groups.map(group=>{const items=activeFoods(d).filter(f=>f.group===group);if(group==='Suplementos'){const count=items.filter(f=>target(f,d)>0),completed=count.filter(f=>Number(d.foods[f.id]||0)>=target(f,d)).length;return `<div class="metric"><b style="font-size:16px">Suplementos</b><p>${completed} de ${count.length} completados</p>${bar(completed,count.length||1)}${count.map(f=>{const q=Math.max(0,Number(d.foods[f.id])||0),t=target(f,d),eff=effective(f,d);return `<small style="display:block;margin-top:7px">${safeText(eff.name)}: ${Math.round(q*10)/10} / ${Math.round(t*10)/10} ${eff.unit} ${q>=t?'· Completado':''}</small>`}).join('')}</div>`;}const planned=items.reduce((n,f)=>n+target(f,d)*effective(f,d).k,0),done=items.reduce((n,f)=>n+Math.min(Math.max(0,Number(d.foods[f.id])||0),target(f,d))*effective(f,d).k,0),pct=planned>0?Math.round(100*done/planned):0;return `<div class="metric"><b style="font-size:16px">${safeText(group)}</b><p>${pct}% registrado</p>${bar(done,planned||1)}<small>${Math.round(done)} / ${Math.round(planned)} kcal del plan</small></div>`}).join('')}</div><label>Notas del día (opcional)<br><textarea id="dailyNote" style="width:100%;min-height:65px;padding:10px;border:1px solid #cbd9ce;border-radius:9px;font:inherit" placeholder="Ej.: comida fuera de casa, apetito, cambio de horario..." onchange="setDailyNote(this.value)">${safeText(d.note||'')}</textarea></label></section>`}

function setDailyNote(value){day().note=String(value).slice(0,1000);save()}
function exportBackup(){const data=JSON.stringify({app:'NutriTrack',version:1,exportedAt:new Date().toISOString(),state},null,2);const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nutritrack-copia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBackup(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data.app!=='NutriTrack'||!data.state||!Array.isArray(data.state.weights)||!data.state.days||!data.state.profile)throw Error('Formato no válido');if(!confirm('¿Restaurar esta copia? Sustituirá TODOS los datos actuales guardados en este navegador.'))return;state=data.state;state.profile={...profileDefaults,...state.profile};save();render();alert('Copia restaurada correctamente.')}catch(err){alert('No se pudo importar la copia: '+err.message)}};reader.readAsText(file)}
function backupPanel(){return `<section class="panel"><h2>Copia de seguridad</h2><p class="note">Los registros se sincronizan con Supabase. Guarda también una copia JSON periódicamente. Puede contener información personal: consérvala en un lugar privado.</p><div class="flex"><button onclick="exportBackup()">Descargar copia de mis datos</button><label>Restaurar copia <input type="file" accept=".json,application/json" onchange="importBackup(this)"></label></div><p class="note danger">Restaurar sustituye los registros actuales; antes de hacerlo, descarga una copia.</p></section>`}
function setD(field,value){day()[field]=value;save();render()}function training(){let d=day();el(`<section class="panel"><h2>Registro de entrenamiento</h2>${headerDay()}<label>¿Has entrenado realmente? <select onchange="setD('gym',this.value==='null'?null:this.value==='yes')"><option value="null" ${d.gym===null?'selected':''}>Sin registrar</option><option value="yes" ${d.gym===true?'selected':''}>Sí</option><option value="no" ${d.gym===false?'selected':''}>No</option></select></label><label>Tipo <select onchange="setD('type',this.value)">${['Pesas','Cardio - correr','Cardio - natación','Cardio - bicicleta','Mixto','Otro'].map(x=>`<option ${d.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Duración (minutos) <input type="number" min="0" max="600" value="${d.minutes}" onchange="setD('minutes',Math.max(0,Number(this.value)||0))"></label><label>Intensidad <select onchange="setD('intensity',this.value)">${['Suave','Moderada','Alta'].map(x=>`<option ${d.intensity===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="panel" style="background:#f1f8f3"><h3>Objetivos extra</h3><p class="note">Marca los grupos o actividades adicionales que hayas trabajado hoy.</p><div class="grid">${[['abs','Abdominales'],['legs','Piernas'],['arms','Brazos'],['glutes','Glúteos'],['cardioExtra','Cardio']].map(([key,label])=>`<label><input type="checkbox" ${d[key]?'checked':''} onchange="setD('${key}',this.checked)"> ${label}</label>`).join('')}</div></div><p class="note">El gasto del ejercicio no se suma automáticamente a las calorías: el objetivo de entrenamiento ya contempla actividad habitual. Más adelante incorporaremos recomendaciones prudentes para sesiones extraordinarias.</p></section>`)}function calendar(){let date=new Date(selected+'T12:00:00'),y=date.getFullYear(),m=date.getMonth(),count=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;let cells=Array.from({length:offset},()=>'<div></div>').join('');for(let i=1;i<=count;i++){let id=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,d=state.days[id],pct=d?(relaxedEntries(d).length||Object.values(d.foods||{}).some(v=>Number(v)>0)?calendarFoodPct(d):null):null;cells+=`<button class="day ${id===selected?'selected':''} ${pct===null?'':pct>=90?'good':pct>=60?'mid':'bad'}" onclick="selected='${id}';render()">${i}<span class="pct">${pct===null?'—':pct+'%'}</span><span>${d?.gym===true?'🏋️':d?.gym===false?'✕':''}${d?.abs?' · A':''}${d?.legs?' · P':''}</span></button>`}el(`<section class="panel"><h2>Calendario mensual</h2><div class="flex"><button onclick="shiftMonth(-1)">‹</button><b>${date.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)">›</button></div><p class="note">Porcentaje más alto entre el menú personalizado y el modo relajado. El modo relajado se calcula sobre el objetivo energético diario (máximo 100 %). 🏋️ gimnasio, A abdominales, P piernas. «—» sin registrar.</p><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<div style="text-align:center"><b>${x}</b></div>`).join('')}${cells}</div></section><section class="panel"><h3>Día seleccionado</h3>${headerDay()}<p>Alimentación: <b>${calendarFoodPct(day())}%</b> · Gimnasio: <b>${day().gym===null?'Sin registrar':day().gym?'Sí':'No'}</b></p><div class="flex"><button onclick="tab='Alimentación';render()">Ver alimentos</button><button onclick="tab='Entrenamiento';render()">Ver entrenamiento</button></div></section>`)}function shiftMonth(delta){let d=new Date(selected+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+delta);selected=d.toLocaleDateString('en-CA');render()}function addWeight(){let n=Number(document.getElementById('weight').value);if(n<=0||n>400)return alert('Introduce un peso válido');state.weights=state.weights.filter(x=>x.date!==selected);state.weights.push({date:selected,value:n});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function editWeight(date){const entry=state.weights.find(x=>x.date===date);if(!entry)return;const raw=prompt('Corrige el peso del '+date+' (kg):',String(entry.value));if(raw===null)return;const n=Number(raw.replace(',','.'));if(!Number.isFinite(n)||n<=0||n>400)return alert('Introduce un peso válido entre 0 y 400 kg.');entry.value=n;save();render()}
function deleteWeight(date){if(!confirm('¿Eliminar el peso registrado el '+date+'? Esta acción no se puede deshacer.'))return;state.weights=state.weights.filter(x=>x.date!==date);save();render()}
function clearWeights(){if(!state.weights.length)return;const answer=prompt('Vas a borrar TODOS los '+state.weights.length+' registros de peso. Para confirmar escribe BORRAR:');if(answer!=='BORRAR')return;state.weights=[];save();render()}
function addMeasures(){let fields=['fat','muscle','waist'];let r={date:selected};for(let f of fields){let raw=document.getElementById(f).value;if(raw!==''){let v=Number(raw);if(v<0||v>300)return alert('Revisa las medidas');r[f]=v}}state.measures=state.measures.filter(x=>x.date!==selected);state.measures.push(r);save();render()}function weightChart(){
 const points=state.weights.filter(x=>Number.isFinite(Number(x.value))&&Number(x.value)>0).slice().sort((a,b)=>a.date.localeCompare(b.date));
 if(points.length<2)return '<p class="note">Introduce al menos dos pesos en fechas diferentes para mostrar el gráfico de evolución.</p>';
 const W=760,H=320,L=56,R=22,T=24,B=48,values=points.map(x=>Number(x.value));
 const goalWeight=Number(state.profile.goalWeight),all=values.concat(Number.isFinite(goalWeight)?[goalWeight]:[]);
 let min=Math.floor((Math.min(...all)-.5)*2)/2,max=Math.ceil((Math.max(...all)+.5)*2)/2;if(max-min<2){min-=1;max+=1}
 const x=i=>L+i*(W-L-R)/Math.max(1,points.length-1),y=v=>T+(max-v)*(H-T-B)/(max-min);
 const poly=arr=>arr.map(q=>`${x(q.i).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ');
 const average=points.map((p,i)=>{let end=new Date(p.date+'T12:00:00'),start=new Date(end);start.setDate(start.getDate()-6);let vals=points.slice(0,i+1).filter(q=>new Date(q.date+'T12:00:00')>=start).map(q=>Number(q.value));return {i,v:vals.reduce((a,b)=>a+b,0)/vals.length}});
 let lines='';for(let i=0;i<=4;i++){let v=min+(max-min)*i/4;lines+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#e1ebe5"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#61776b">${v.toFixed(1)}</text>`}
 const labels=[0,Math.floor((points.length-1)/2),points.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-16}" font-size="12" text-anchor="middle" fill="#61776b">${points[i].date.slice(5)}</text>`).join('');
 const goalLine=Number.isFinite(goalWeight)?`<line x1="${L}" y1="${y(goalWeight)}" x2="${W-R}" y2="${y(goalWeight)}" stroke="#d28c30" stroke-width="2" stroke-dasharray="7 5"/>`:'';
 const circles=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(Number(p.value))}" r="3.5" fill="#89b5a0"><title>${safeText(p.date)}: ${Number(p.value).toFixed(1)} kg</title></circle>`).join('');
 const last=values.at(-1),first=values[0],delta=last-first;
 return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolución del peso con valores diarios, media móvil de siete días y línea del objetivo" style="width:100%;height:auto;display:block">${lines}${goalLine}<polyline points="${poly(points.map((p,i)=>({i,v:Number(p.value)})))}" fill="none" stroke="#91b7a5" stroke-width="2"/>${circles}<polyline points="${poly(average)}" fill="none" stroke="#136c4a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${labels}</svg></div><div class="flex" style="font-size:13px;gap:16px"><span>🟢 Media móvil de 7 días</span><span>● Peso registrado</span><span style="color:#a86b1d">┄ Objetivo (${goalWeight.toFixed(1)} kg)</span></div><p><b>Cambio entre el primer y último registro: ${delta>=0?'+':''}${delta.toFixed(2)} kg.</b> ${points.length>=7?'Valora sobre todo la media móvil, no los cambios diarios.':'Con más registros podrás interpretar mejor la tendencia.'}</p>`;
}
function progress(){let f=forecast();let w=state.weights.slice(-10),ms=state.measures.slice(-5);el(`<section class="panel"><h2>Mi progreso</h2>${headerDay()}<h3>Peso diario</h3><div class="flex"><label>Peso (kg) <input id="weight" type="number" step="0.1" min="1" placeholder="68.0"></label><button class="primary" onclick="addWeight()">Guardar peso</button></div><p class="note">Peso de referencia actual: <b>${latestWeight().toFixed(1)} kg</b>. Las raciones se recalculan según este peso y el gasto estimado; los cambios deliberados del superávit se basan en varias semanas de evolución.</p><h3>Evolución del peso</h3><p class="note">Objetivo: ${state.profile.goalWeight} kg · ${f.dir===0?'Mantenimiento':`Ritmo previsto: ${f.dir>0?'+':'-'}${f.rate.toFixed(2)} kg/semana · llegada aproximada: ${f.date}`}. La evolución real se interpreta mediante medias semanales.</p>${weightChart()}<h3>Últimos registros</h3>${w.length?`<div>${w.slice().reverse().map(x=>`<div class="flex" style="padding:8px 0;border-bottom:1px solid #edf1ee"><span style="flex:1">${x.date}: <b>${x.value} kg</b></span><button onclick="editWeight('${x.date}')">Editar</button><button class="danger" onclick="deleteWeight('${x.date}')">Eliminar</button></div>`).join('')}</div><p><button class="danger" onclick="clearWeights()">Borrar todo el historial de peso</button></p>`:'<p>Todavía no hay pesos registrados.</p>'}</section><section class="panel"><h2>Medidas semanales (opcionales)</h2><div class="flex"><label>Grasa (%) <input id="fat" type="number" step="0.1" min="0"></label><label>Masa muscular (kg) <input id="muscle" type="number" step="0.1" min="0"></label><label>Cintura (cm) <input id="waist" type="number" step="0.1" min="0"></label></div><button class="primary" onclick="addMeasures()">Guardar medidas</button><p class="note">La bioimpedancia doméstica varía con la hidratación; estas mediciones son complementarias. Los ajustes nutricionales se propondrán usando la tendencia de peso de varias semanas, no fluctuaciones diarias.</p><p>${ms.map(x=>`${x.date}: grasa ${x.fat??'—'}%, músculo ${x.muscle??'—'} kg, cintura ${x.waist??'—'} cm`).join('<br>')||'Sin medidas registradas.'}</p></section>${backupPanel()}`)}function updateProfile(field,value){state.profile[field]=field==='sex'?value:Number(value);save();render()}
function applyAdjustment(change){if(state.profile.lastAdjustmentDate===selected)return alert('Ya se aceptó un ajuste para esta fecha. Espera a la siguiente revisión.');state.profile.lastAdjustmentDate=selected;state.profile.adjustment=Math.max(-400,Math.min(400,state.profile.adjustment+change));save();render()}
function profile(){let p=state.profile,e=energy(),r=proposal();el(`<section class="panel"><h2>Mi perfil y cálculo energético</h2><p class="note">Datos editables. Fórmula de Mifflin-St Jeor y factor de actividad orientativo. No sustituye una evaluación individual.</p><div class="grid"><label>Edad (años)<br><input type="number" min="16" max="100" value="${p.age}" onchange="updateProfile('age',this.value)"></label><label>Sexo para la fórmula<br><select onchange="updateProfile('sex',this.value)"><option value="M" ${p.sex==='M'?'selected':''}>Masculino</option><option value="F" ${p.sex==='F'?'selected':''}>Femenino</option></select></label><label>Altura (cm)<br><input type="number" min="100" max="230" value="${p.height}" onchange="updateProfile('height',this.value)"></label><label>Peso inicial (kg)<br><input type="number" min="30" max="300" step="0.1" value="${p.initialWeight}" onchange="updateProfile('initialWeight',this.value)"></label><label>Objetivo de peso (kg)<br><input type="number" min="30" max="300" step="0.1" value="${p.goalWeight}" onchange="updateProfile('goalWeight',this.value)"></label><label>Ritmo deseado (kg/semana)<br><select onchange="updateGoalSetting('weeklyRate',this.value)">${[[.1,'0,10 kg/semana'],[.15,'0,15 kg/semana'],[.2,'0,20 kg/semana'],[.25,'0,25 kg/semana'],[.35,'0,35 kg/semana'],[.5,'0,50 kg/semana']].map(([v,t])=>`<option value="${v}" ${Math.abs((p.weeklyRate||.2)-v)<.001?'selected':''}>${t}</option>`).join('')}</select></label><label>Actividad habitual<br><select onchange="updateProfile('activity',this.value)">${[['1.2','Sedentaria'],['1.375','Ligera'],['1.55','Moderada'],['1.725','Alta']].map(([v,t])=>`<option value="${v}" ${Math.abs(p.activity-Number(v))<.001?'selected':''}>${t} (${v})</option>`).join('')}</select></label></div><div class="panel" style="background:#f1f8f3"><h3>Trayectoria de peso saludable</h3>${(()=>{let f=forecast();return `<p><b>${f.dir>0?'Ganancia gradual':f.dir<0?'Pérdida gradual':'Mantenimiento'}</b> · ${Math.abs(f.diff).toFixed(1)} kg ${f.dir>0?'por ganar':f.dir<0?'por perder':'de diferencia'}.</p><p>Ritmo elegido y limitado a un rango prudente: <b>${f.rate.toFixed(2)} kg/semana</b>. ${f.dir?`Plazo orientativo: <b>${Math.ceil(f.weeks)} semanas</b> (aprox. ${f.date}).`:'Ya estás cerca del peso objetivo.'}</p><p>Superávit/déficit inicial estimado: <b>${plannedSurplus()>0?'+':''}${Math.round(plannedSurplus())} kcal/día</b> sobre el mantenimiento, antes de distribuir energía entre días de entrenamiento y descanso.</p><p class="note">La fecha es una proyección, no una garantía. Los ritmos máximos se limitan según el peso actual. La ganancia no será exclusivamente músculo y una pérdida rápida no es necesariamente saludable. Ajusta el objetivo si hay circunstancias clínicas especiales.</p>`})()}</div><div class="grid"><div class="metric">Peso de referencia<b>${e.w.toFixed(1)} kg</b></div><div class="metric">Metabolismo basal<b>${Math.round(e.bmr)} kcal</b></div><div class="metric">Gasto diario estimado<b>${Math.round(e.tdee)} kcal</b></div><div class="metric">Ajuste por tendencia<b>${p.adjustment>0?'+':''}${p.adjustment} kcal</b></div></div><p class="note">Objetivo de entrenamiento: ${goal({training:true})} kcal; descanso: ${goal({training:false})} kcal. El factor de actividad ya representa la actividad habitual; la diferencia por día es una distribución orientativa, no calorías del gimnasio añadidas dos veces.</p></section><section class="panel"><h2>Revisión de la tendencia</h2>${r?`<p>Media reciente: <b>${r.current.toFixed(2)} kg</b>. Media de hace dos semanas: <b>${r.previous.toFixed(2)} kg</b>. Cambio aproximado: <b>${r.weekly>=0?'+':''}${r.weekly.toFixed(2)} kg/semana</b>.</p>${r.change&&p.lastAdjustmentDate!==selected?`<p>Se propone ${r.change>0?'aumentar':'reducir'} ${Math.abs(r.change)} kcal/día para aproximarse al ritmo de ${r.rate.toFixed(2)} kg/semana hacia el objetivo.</p><button class="primary" onclick="applyAdjustment(${r.change})">Aceptar ajuste de ${r.change>0?'+':''}${r.change} kcal</button>`:'<p class="note">No se propone un nuevo ajuste ahora. Revisa la tendencia durante al menos dos semanas y no repitas ajustes el mismo día.</p>'}`:'<p class="note">Para proponer ajustes por evolución se necesitan al menos tres registros en cada una de dos ventanas semanales separadas por dos semanas. No se realizan cambios automáticos de superávit.</p>'}<p class="note">Al modificar el peso, el gasto y las raciones se recalculan. El ritmo objetivo determina un superávit o déficit inicial prudente; la dirección se infiere del peso objetivo. Las propuestas de +/−100 kcal requieren confirmación. Si tienes condiciones de salud o restricciones alimentarias, este menú genérico deberá personalizarse antes de utilizarlo como pauta.</p></section><section class="panel"><h2>Salud, restricciones y preferencias</h2><p class="note">Selecciona las condiciones que afectan a tus elecciones alimentarias. Las restricciones se comprueban por nombre de alimento, se proponen alternativas cuando existen y se bloquea el registro de alimentos detectados como incompatibles. Es un filtro orientativo: no verifica ingredientes, contaminación cruzada ni etiquetas. Las enfermedades requieren valoración individual: la app no prescribe una dieta clínica.</p><div class="grid">${healthOptions.map(([code,label])=>`<label><input type="checkbox" ${((p.health||[]).includes(code))?'checked':''} onchange="setHealth('${code}',this.checked)"> ${label}</label>`).join('')}</div><label>Alimentos que no deseas consumir (separados por comas)<br><input style="width:100%" value="${safeText(p.avoidFoods)}" placeholder="Ej.: boniato, cerdo" onchange="setPreference('avoidFoods',this.value);render()"></label><label>Preferencias o peticiones especiales<br><textarea style="width:100%;min-height:85px;padding:10px;border:1px solid #cbd9ce;border-radius:9px;font:inherit" placeholder="Ej.: prefiero patata, cuatro comidas al día" onchange="setPreference('preferences',this.value)">${safeText(p.preferences)}</textarea></label>${(p.health||[]).some(x=>['gallstones','renal','diabetes','cholesterol','other'].includes(x))?'<p class="danger">Hay condiciones clínicas registradas. El plan genérico NO está adaptado clínicamente: revisa alimentos y cantidades con un profesional antes de usarlo como pauta.</p>':''}<p class="note">Los datos se almacenan en tu cuenta privada de Supabase y también en una copia local de este dispositivo. No sustituyen una evaluación clínica.</p></section>`)}

// Supabase: el navegador conserva una copia por usuario, pero la cuenta en la nube es la fuente compartida.
const SUPABASE_URL='https://ehnwtohqnrisrkquhdvy.supabase.co', SUPABASE_PUBLIC_KEY='sb_publishable_GoSiOaRNrKuCJ2TrfQOCgQ_IQ9kbtPf';
let db=null,cloudUser=null,cloudReady=false,cloudSaving=false,cloudDirty=false,cloudTimer=null,cloudError='',legacySnapshot=null,cloudEpoch=0;
const invitationLink=/[?#&]type=invite(?:&|$)/.test(location.href);
let acceptingInvite=invitationLink;
function userCacheKey(){return 'nutritrack_user_'+cloudUser.id}
function statusLine(message){const el=document.getElementById('cloudStatus');if(el)el.textContent=message}
function localLegacy(){for(const key of [KEY,PREVKEY,OLDKEY]){try{const raw=localStorage.getItem(key);if(raw){const v=JSON.parse(raw);if(v&&typeof v==='object'&&v.days&&Array.isArray(v.weights))return v}}catch{}}return null}
function safeState(v){if(!v||typeof v!=='object'||!v.days||!Array.isArray(v.weights)||!Array.isArray(v.measures)||!v.profile)throw Error('Los datos no tienen el formato esperado');return {days:v.days,weights:v.weights,measures:v.measures,profile:{...profileDefaults,...v.profile}}}
function showLogin(message=''){
 document.getElementById('tabs').innerHTML='';statusLine('Acceso privado');
 document.getElementById('app').innerHTML=`<section class="panel auth-shell"><h2>Acceder a NutriTrack</h2><p class="note">Utiliza el usuario que has creado en Supabase. Solo las cuentas autorizadas pueden acceder a sus registros.</p><form onsubmit="loginNutri(event)"><label>Correo electrónico<input id="loginEmail" type="email" required autocomplete="username"></label><label>Contraseña<input id="loginPassword" type="password" required autocomplete="current-password"></label><button class="primary" type="submit" id="loginButton">Iniciar sesión</button></form>${message?`<p class="errorline">${safeText(message)}</p>`:''}<p class="note">Si la conexión falla, no se eliminarán tus registros anteriores del navegador.</p></section>`;
}
function showInvitePassword(message=''){
 document.getElementById('tabs').innerHTML='';statusLine('Activar invitación');
 document.getElementById('app').innerHTML=`<section class="panel auth-shell"><h2>Bienvenido a NutriTrack</h2><p>Has abierto una invitación. Elige una contraseña personal para activar tu cuenta.</p><form onsubmit="setInvitePassword(event)"><label>Nueva contraseña<input id="invitePassword" type="password" minlength="12" required autocomplete="new-password"></label><label>Repite la contraseña<input id="invitePasswordConfirm" type="password" minlength="12" required autocomplete="new-password"></label><button class="primary" type="submit" id="inviteButton">Guardar contraseña y continuar</button></form>${message?`<p class="errorline">${safeText(message)}</p>`:''}<p class="note">Utiliza al menos 12 caracteres. Nunca compartas tu contraseña. Si la invitación ha caducado, solicita otra al administrador.</p></section>`;
}
async function setInvitePassword(event){
 event.preventDefault();const a=document.getElementById('invitePassword').value,b=document.getElementById('invitePasswordConfirm').value;
 if(a!==b)return showInvitePassword('Las contraseñas no coinciden. Inténtalo de nuevo.');
 if(a.length<12)return showInvitePassword('La contraseña debe tener al menos 12 caracteres.');
 const btn=document.getElementById('inviteButton');btn.disabled=true;btn.textContent='Activando cuenta…';
 const {data:{user},error:userError}=await db.auth.getUser();
 if(userError||!user)return showInvitePassword('El enlace ha caducado o no es válido. Solicita una nueva invitación.');
 const {error}=await db.auth.updateUser({password:a});
 if(error)return showInvitePassword('No se ha podido establecer la contraseña: '+error.message);
 acceptingInvite=false;
 history.replaceState(null,'',location.pathname+location.search.replace(/([?&])type=invite(&|$)/,'$1').replace(/[?&]$/,''));
 await connectUser();
}
async function loginNutri(event){event.preventDefault();if(!db)return showLogin('No se pudo cargar Supabase. Comprueba tu conexión.');let btn=document.getElementById('loginButton');btn.disabled=true;btn.textContent='Accediendo…';let {error}=await db.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(error)showLogin('No se ha podido iniciar sesión: '+error.message);else await connectUser()}
async function startCloud(){
 legacySnapshot=localLegacy();
 if(!window.supabase?.createClient){showLogin('No se pudo cargar la biblioteca de Supabase. Comprueba la conexión a Internet.');return}
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data:sessionData}=await db.auth.getSession();const {data,error}=await db.auth.getUser();if(acceptingInvite){if(!sessionData?.session||error||!data?.user){showInvitePassword('No se ha podido verificar el enlace de invitación. Comprueba que no haya caducado.');return}showInvitePassword();return}if(error||!data?.user){showLogin();return}await connectUser(data.user);
}
async function connectUser(givenUser){
 const epoch=++cloudEpoch;clearTimeout(cloudTimer);cloudReady=false;cloudUser=null;state=blank();document.getElementById('tabs').innerHTML='';document.getElementById('app').innerHTML='<section class="panel"><h2>Cargando datos privados…</h2></section>';
 const {data:auth,error:authError}=givenUser?{data:{user:givenUser}}:await db.auth.getUser();
 if(epoch!==cloudEpoch)return;
 if(authError||!auth?.user){showLogin('Sesión no válida. Vuelve a iniciar sesión.');return}
 const uid=auth.user.id;
 const {data:member,error:memberError}=await db.from('nt_members').select('user_id').eq('user_id',uid).maybeSingle();
 if(epoch!==cloudEpoch)return;
 if(memberError||!member){await db.auth.signOut();showLogin('Tu contraseña ya está creada, pero el administrador todavía debe autorizar tu cuenta en NutriTrack. Cuando esté autorizada, vuelve a iniciar sesión.');return}
 cloudUser=auth.user;statusLine('Cargando datos privados…');
 try{
  const results=await Promise.all([
   db.from('nt_profiles').select('data').eq('user_id',uid).maybeSingle(),
   db.from('nt_days').select('day_date,data').eq('user_id',uid),
   db.from('nt_weights').select('measured_on,weight_kg').eq('user_id',uid),
   db.from('nt_measures').select('measured_on,body_fat_pct,muscle_kg,waist_cm').eq('user_id',uid)
  ]);
  if(epoch!==cloudEpoch)return;
  const err=results.find(r=>r.error);if(err)throw err.error;
  const [pr,ds,ws,ms]=results;
  const hasRemote=!!pr.data||ds.data.length>0||ws.data.length>0||ms.data.length>0;
  const remote={profile:{...profileDefaults,...(pr.data?.data||{})},days:Object.fromEntries(ds.data.map(r=>[r.day_date,r.data])),weights:ws.data.map(r=>({date:r.measured_on,value:Number(r.weight_kg)})).sort((a,b)=>a.date.localeCompare(b.date)),measures:ms.data.map(r=>({date:r.measured_on,...(r.body_fat_pct===null?{}:{fat:Number(r.body_fat_pct)}),...(r.muscle_kg===null?{}:{muscle:Number(r.muscle_kg)}),...(r.waist_cm===null?{}:{waist:Number(r.waist_cm)})})).sort((a,b)=>a.date.localeCompare(b.date))};
  if(hasRemote){state=safeState(remote)}else{state=blank()}
  localStorage.setItem(userCacheKey(),JSON.stringify(state));
  cloudReady=true;cloudError='';statusLine('☁ Conectado');tab='Inicio';render();
  // Nunca ofrecer datos heredados a otra cuenta: la migración antigua requiere una operación administrativa independiente.
 }catch(e){if(epoch!==cloudEpoch)return;cloudReady=false;cloudError=e.message||String(e);statusLine('Error de sincronización');document.getElementById('tabs').innerHTML='';document.getElementById('app').innerHTML=`<section class="panel"><h2>No se pudieron cargar los datos</h2><p class="errorline">${safeText(cloudError)}</p><p>No se han borrado tus registros locales. Comprueba las políticas de Supabase antes de continuar.</p><button onclick="connectUser()">Reintentar</button> <button onclick="logoutNutri()">Cerrar sesión</button></section>`}
}
function cloudPanel(){return `<section class="panel"><div class="flex"><b>☁ Cuenta privada</b><small>${safeText(cloudUser?.email||'')}</small><button onclick="syncNow()">Sincronizar ahora</button><button onclick="logoutNutri()">Cerrar sesión</button></div><p class="note" id="syncMessage">${cloudError?`Error: ${safeText(cloudError)}`:'Los cambios se guardan automáticamente en Supabase. Si eres un usuario nuevo, empieza con un perfil sin registros. Conserva también una copia JSON.'}</p></section>`}
function queueCloudSave(){if(!cloudReady)return;cloudDirty=true;statusLine('Guardando…');clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>syncNow(),650)}
async function syncNow(){
 if(!cloudUser||!cloudReady||cloudSaving)return;
 cloudSaving=true;clearTimeout(cloudTimer);cloudDirty=false;
 const snapshot=JSON.parse(JSON.stringify(state)),uid=cloudUser.id,epoch=cloudEpoch;
 try{
  const operations=[];
  // Los registros son propios del usuario autenticado y están protegidos por RLS.
  operations.push(await db.from('nt_profiles').upsert({user_id:uid,data:snapshot.profile},{onConflict:'user_id'}));
  if(operations.at(-1).error)throw operations.at(-1).error;
  // La escritura secuencial evita solapamientos en las sincronizaciones del mismo dispositivo.
  for(const [table,rows,key] of [
   ['nt_days',Object.entries(snapshot.days).map(([date,data])=>({user_id:uid,day_date:date,data})),'day_date'],
   ['nt_weights',snapshot.weights.map(x=>({user_id:uid,measured_on:x.date,weight_kg:Number(x.value)})),'measured_on'],
   ['nt_measures',snapshot.measures.map(x=>({user_id:uid,measured_on:x.date,body_fat_pct:x.fat??null,muscle_kg:x.muscle??null,waist_cm:x.waist??null})),'measured_on']
  ]){
   const read=await db.from(table).select(key).eq('user_id',uid);if(read.error)throw read.error;
   const wanted=new Set(rows.map(r=>r[key]));const removed=read.data.map(r=>r[key]).filter(v=>!wanted.has(v));
   if(rows.length){for(let i=0;i<rows.length;i+=200){const result=await db.from(table).upsert(rows.slice(i,i+200),{onConflict:'user_id,'+key});if(result.error)throw result.error}}
   if(removed.length){const result=await db.from(table).delete().eq('user_id',uid).in(key,removed);if(result.error)throw result.error}
  }
  if(epoch!==cloudEpoch)return;cloudError='';statusLine('☁ Sincronizado');
 }catch(e){if(epoch===cloudEpoch){cloudError=e.message||String(e);cloudDirty=true;statusLine('⚠ Error al guardar');}}
 finally{cloudSaving=false;if(epoch!==cloudEpoch)return;const m=document.getElementById('syncMessage');if(m)m.textContent=cloudError?'Error de sincronización: '+cloudError:'Datos guardados en Supabase.';if(cloudDirty&&!cloudError){cloudTimer=setTimeout(()=>syncNow(),400)} }
}
function showMigrationOffer(){
 const container=document.getElementById('app');const section=document.createElement('section');section.className='panel';section.id='migrationOffer';section.innerHTML=`<h2>Importar datos de la versión anterior</h2><p>He encontrado registros de NutriTrack guardados anteriormente en este navegador. Tu cuenta de Supabase está vacía.</p><p><b>Antes de importarlos, descarga una copia.</b> La importación sustituirá los datos vacíos de esta cuenta; no elimina la copia anterior del navegador.</p><div class="flex"><button onclick="exportLegacyBackup()">Descargar copia anterior</button><button class="primary" onclick="migrateLegacy()">Importar a mi cuenta</button><button onclick="document.getElementById('migrationOffer').remove()">Ahora no</button></div>`;container.prepend(section)
}
function exportLegacyBackup(){if(!legacySnapshot)return;const blob=new Blob([JSON.stringify({app:'NutriTrack',version:1,exportedAt:new Date().toISOString(),state:legacySnapshot},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='nutritrack-anterior.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function migrateLegacy(){alert('La migración automática está deshabilitada por seguridad entre cuentas.');return;if(!legacySnapshot||!cloudReady)return;if(!confirm('¿Importar tus registros anteriores a esta cuenta? Se conservará la copia anterior del navegador.'))return;try{state=safeState(legacySnapshot);localStorage.setItem(userCacheKey(),JSON.stringify(state));cloudDirty=true;await syncNow();if(cloudError)throw Error(cloudError);legacySnapshot=null;render();alert('Importación completada. Comprueba tus registros y descarga una copia JSON.')}catch(e){alert('No se ha completado la importación: '+e.message)}}
async function logoutNutri(){if(cloudSaving||cloudDirty){if(!confirm('Hay cambios pendientes de sincronizar. ¿Cerrar sesión de todos modos?'))return}++cloudEpoch;clearTimeout(cloudTimer);cloudReady=false;cloudUser=null;state=blank();document.getElementById('tabs').innerHTML='';await db.auth.signOut();showLogin()}

function render(){if(!cloudUser){showLogin();return}nav();({Inicio:home,Alimentación:eating,Entrenamiento:training,Calendario:calendar,Progreso:progress,'Mi perfil':profile}[tab])()}startCloud();
</script></body></html>
